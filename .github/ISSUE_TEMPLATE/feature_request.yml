name: Idea or feature request
description: Suggest something Vepol could do for you.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine Vepol handling it. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
